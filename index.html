<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ECO SPORT AI CUSTOMER SERVICE</title>
    <!-- Library Puter.js -->
    <script src="https://js.puter.com/v2/"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; overscroll-behavior: none; }
        .chat-bg { background-color: #efeae2; background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDQwIDQwIiBmaWxsPSJub25lIiBvcGFjaXR5PSIwLjA1Ij48cGF0aCBkPSJNMjAgMjBIMEwwIDQwTDIwIDIwek00MCAyMEgyMEEyMCAyMCAwIDAwMCA0MGgyMHoiIGZpbGw9IiMwMDAiLz48L3N2Zz4='); }
        .chat-bubble-in { background-color: #ffffff; border-radius: 10px 0 10px 10px; }
        .chat-bubble-out { background-color: #d9fdd3; border-radius: 0 10px 10px 10px; }
        .chat-bubble-ai { background-color: #e7f3ff; border-radius: 0 10px 10px 10px; border-left: 4px solid #25D366; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .scroll-y { overflow-y: auto; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
        .scroll-y::-webkit-scrollbar { width: 4px; }
        .scroll-y::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
        
        .panel { transition: transform 0.3s ease-in-out; }
        @media (max-width: 768px) {
            #panel-chat { position: fixed; top: 56px; bottom: 0; left: 0; width: 100%; z-index: 30; transform: translateX(100%); background: #efeae2; }
            #panel-chat.active { transform: translateX(0); }
            #panel-detail { position: fixed; top: 56px; bottom: 0; right: 0; width: 85%; max-width: 320px; z-index: 40; transform: translateX(100%); box-shadow: -2px 0 10px rgba(0,0,0,0.1); background: white; }
            #panel-detail.active { transform: translateX(0); }
        }
        .animate-pulse-custom { animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .bounce-dot { animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    </style>
</head>
<body class="h-screen flex flex-col bg-gray-100">

    <!-- Header -->
    <header class="bg-green-600 text-white p-3 flex justify-between items-center shadow-md z-50 flex-shrink-0 h-14">
        <div class="flex items-center space-x-3">
            <button onclick="showPanel('list')" class="md:hidden p-2 -ml-2"><i class="fas fa-bars text-lg"></i></button>
            <i class="fas fa-robot text-xl hidden md:block"></i>
            <div class="leading-tight">
                <h1 class="font-bold text-sm md:text-lg">ECO SPORT AI</h1>
                <p class="text-[10px] md:text-xs text-green-100">Customer Service Jersey</p>
            </div>
        </div>
        <div class="flex items-center space-x-2 text-sm">
            <a href="https://wa.me/6285709693800" target="_blank" class="flex items-center space-x-1 md:space-x-2 bg-green-700 px-2 md:px-3 py-1 rounded-full hover:bg-green-800 transition text-xs md:text-sm">
                <i class="fab fa-whatsapp"></i> <span class="hidden md:inline">085709693800</span><span class="md:hidden">WA</span>
            </a>
            <button onclick="openSettings()" class="bg-white text-green-600 p-2 rounded-full hover:bg-green-50 transition flex items-center justify-center w-8 h-8">
                <i class="fas fa-cog text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- PANEL KIRI: Daftar Chat -->
        <aside id="panel-list" class="panel w-full md:w-1/4 bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
            <div class="p-3 border-b flex-shrink-0">
                <div class="grid grid-cols-3 gap-2 text-center text-xs">
                    <div class="bg-gray-50 p-2 rounded border border-gray-100">
                        <span class="block font-bold text-gray-800 text-base" id="statTotal">0</span>
                        <span class="text-gray-500 text-[10px]">Total Chat</span>
                    </div>
                    <div class="bg-blue-50 p-2 rounded border border-blue-100">
                        <span class="block font-bold text-blue-600 text-base" id="statAI">0</span>
                        <span class="text-gray-500 text-[10px]">AI Reply</span>
                    </div>
                    <div class="bg-green-50 p-2 rounded border border-green-100">
                        <span class="block font-bold text-green-600 text-base" id="statAdmin">0</span>
                        <span class="text-gray-500 text-[10px]">Admin</span>
                    </div>
                </div>
            </div>
            <div class="flex-1 scroll-y pb-4" id="chatList"></div>
            <div class="p-2 border-t bg-gray-50 flex gap-2">
                <button onclick="simulateTestMessage()" class="w-1/2 bg-gray-200 text-gray-700 text-xs py-2 rounded-lg hover:bg-gray-300 font-semibold">
                    <i class="fas fa-flask"></i> Webhook
                </button>
                <button onclick="openSettings()" class="w-1/2 bg-blue-100 text-blue-700 text-xs py-2 rounded-lg hover:bg-blue-200 font-semibold">
                    <i class="fas fa-database"></i> Database
                </button>
            </div>
        </aside>

        <!-- PANEL TENGAH: Percakapan -->
        <main id="panel-chat" class="panel flex-1 flex flex-col bg-gray-50">
            <div class="bg-gray-100 p-2 border-b flex justify-between items-center flex-shrink-0 h-14">
                <div class="flex items-center space-x-2">
                    <button onclick="showPanel('list')" class="md:hidden p-2 text-gray-600 hover:bg-gray-200 rounded-full">
                        <i class="fas fa-arrow-left text-lg"></i>
                    </button>
                    <div class="w-9 h-9 bg-gray-300 rounded-full flex items-center justify-center text-gray-600 font-bold text-sm" id="chatAvatar">?</div>
                    <div>
                        <h3 class="font-semibold text-gray-800 text-sm" id="chatName">Pilih percakapan</h3>
                        <span class="text-[10px] text-gray-500 flex items-center gap-1" id="chatStatus">Status: -</span>
                    </div>
                </div>
                <div class="flex space-x-1">
                    <button onclick="adminTakeover()" class="bg-blue-500 text-white px-2 py-1.5 rounded-lg text-[10px] hover:bg-blue-600 transition flex items-center gap-1 font-semibold">
                        <i class="fas fa-hand-paper"></i> Ambil Alih
                    </button>
                    <button onclick="returnToAI()" class="bg-green-500 text-white px-2 py-1.5 rounded-lg text-[10px] hover:bg-green-600 transition flex items-center gap-1 font-semibold">
                        <i class="fas fa-robot"></i> Ke AI
                    </button>
                    <button onclick="showPanel('detail')" class="md:hidden bg-gray-200 text-gray-700 p-1.5 rounded-lg hover:bg-gray-300 transition w-8 h-8 flex items-center justify-center">
                        <i class="fas fa-info-circle"></i>
                    </button>
                </div>
            </div>
            
            <div class="flex-1 chat-bg p-3 scroll-y" id="chatMessages"></div>

            <div class="bg-gray-100 p-2 border-t flex items-center space-x-2 flex-shrink-0 h-14">
                <input type="text" id="messageInput" onkeypress="handleEnter(event)" class="flex-1 px-4 py-2.5 rounded-full border border-gray-300 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 text-sm" placeholder="Ketik balasan admin...">
                <button onclick="adminSendMessage()" class="bg-green-600 text-white p-2.5 rounded-full hover:bg-green-700 transition w-10 h-10 flex justify-center items-center flex-shrink-0">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </main>

        <!-- PANEL KANAN: Detail Pelanggan -->
        <aside id="panel-detail" class="panel md:w-80 lg:w-96 bg-white border-l border-gray-200 scroll-y flex-shrink-0">
            <div class="p-4 border-b flex justify-between items-center md:hidden">
                <h2 class="font-bold">Detail Pelanggan</h2>
                <button onclick="showPanel('chat')" class="text-gray-500 text-xl">&times;</button>
            </div>
            <div id="customerDetailContent" class="p-4">
                <div class="text-center text-gray-400 mt-10">
                    <i class="fas fa-user-circle text-5xl mb-3"></i>
                    <p class="text-sm">Detail pelanggan akan muncul di sini</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- Tombol Sambungkan AI (Wajib diklik untuk mengaktifkan AI Puter) -->
    <button id="btnConnectAI" class="fixed bottom-4 right-4 bg-blue-600 text-white px-4 py-3 rounded-full shadow-lg z-40 flex items-center gap-2 text-sm font-semibold hover:bg-blue-700 transition">
        <i class="fas fa-plug"></i> Sambungkan AI
    </button>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 justify-center items-center p-0 md:p-4" style="display: none;">
        <div class="bg-white rounded-none md:rounded-xl shadow-2xl w-full md:max-w-2xl max-h-screen md:max-h-[90vh] scroll-y flex flex-col">
            <div class="p-4 border-b flex justify-between items-center sticky top-0 bg-white z-10 flex-shrink-0">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i class="fas fa-cog text-green-600"></i> Pengaturan Sistem</h2>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-gray-800 text-2xl w-8 h-8 flex items-center justify-center">&times;</button>
            </div>
            <div class="p-4 md:p-6 space-y-4 overflow-y-auto">
                
                <div class="border-b pb-4">
                    <h3 class="font-semibold text-gray-700 mb-3 text-sm">Mode & Status</h3>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <label class="flex items-center space-x-2 cursor-pointer p-2 border rounded-lg hover:bg-gray-50">
                            <input type="checkbox" id="setAutoReply" checked> <span>Auto Reply</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer p-2 border rounded-lg hover:bg-gray-50">
                            <input type="checkbox" id="setAiActive" checked> <span>AI Active</span>
                        </label>
                    </div>
                </div>

                <div class="border-b pb-4">
                    <h3 class="font-semibold text-gray-700 mb-2 text-sm">Waktu Respon AI (Timer)</h3>
                    <select id="setTimer" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none text-sm">
                        <option value="5">5 Detik (Cepat)</option>
                        <option value="10">10 Detik</option>
                        <option value="30" selected>30 Detik (Default)</option>
                        <option value="60">1 Menit</option>
                        <option value="300">5 Menit</option>
                    </select>
                </div>

                <div class="border-b pb-4">
                    <h3 class="font-semibold text-gray-700 mb-2 text-sm">Database Harga & FAQ</h3>
                    <textarea id="setDatabase" class="w-full h-32 border rounded-lg p-2 text-xs focus:ring-2 focus:ring-green-500 focus:outline-none">Harga Jersey Futsal: 85.000/pcs. Harga Jersey Bola: 95.000/pcs. Minimal Order: 10 pcs. Bahan: Dryfit, Mesh, Full Print. Ukuran: S, M, L, XL, XXL. Lama Produksi: 5-7 Hari Kerja.</textarea>
                </div>

                <div class="border-b pb-4">
                    <h3 class="font-semibold text-gray-700 mb-2 text-sm">Prompt Internal AI (Karakter)</h3>
                    <textarea id="setSystemPrompt" class="w-full h-32 border rounded-lg p-2 text-xs focus:ring-2 focus:ring-green-500 focus:outline-none">Kamu adalah Eco Sport AI. Jawab dengan ramah, sopan, dan profesional dalam Bahasa Indonesia. Jangan mengarang harga. Jika tidak tahu, arahkan ke admin. Tanyakan detail pesanan satu per satu.</textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2 pb-4 sticky bottom-0 bg-white">
                    <button onclick="closeSettings()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 font-semibold text-sm">Batal</button>
                    <button onclick="saveSettings()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 font-semibold text-sm">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- STATE MANAGEMENT ---
        let appState = {
            waNumber: '085709693800',
            aiActive: true,
            autoReply: true,
            timer: 30,
            systemPrompt: "Kamu adalah Eco Sport AI. Jawab dengan ramah, sopan, dan profesional dalam Bahasa Indonesia. Jangan mengarang harga. Jika tidak tahu, arahkan ke admin. Tanyakan detail pesanan satu per satu.",
            database: "Harga Jersey Futsal: 85.000/pcs. Harga Jersey Bola: 95.000/pcs. Minimal Order: 10 pcs. Bahan: Dryfit, Mesh, Full Print. Ukuran: S, M, L, XL, XXL. Lama Produksi: 5-7 Hari Kerja.",
            stats: { ai: 0, admin: 0 },
            chats: [],
            activeChatId: null
        };

        let puterReady = false;

        // --- INISIALISASI AI PUTER ---
        // Memaksa popup muncul saat tombol diklik untuk menghindari silent fail
        document.getElementById('btnConnectAI').addEventListener('click', async () => {
            try {
                document.getElementById('btnConnectAI').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menghubungkan...';
                if (!puter.auth.isSignedIn()) {
                    await puter.auth.signIn();
                } 
                puterReady = true;
                document.getElementById('btnConnectAI').classList.add('hidden');
                alert("AI Eco Sport berhasil tersambung! Silakan tes pesan masuk.");
            } catch (e) {
                document.getElementById('btnConnectAI').innerHTML = '<i class="fas fa-plug"></i> Sambungkan AI';
                alert("Gagal menyambungkan AI. Pastikan popup tidak diblokir browser.");
            }
        });

        // --- NAVIGASI PANEL MOBILE ---
        function showPanel(name) {
            if (window.innerWidth < 768) {
                document.getElementById('panel-list').classList.remove('active');
                document.getElementById('panel-chat').classList.remove('active');
                document.getElementById('panel-detail').classList.remove('active');
                if(name === 'chat') document.getElementById('panel-chat').classList.add('active');
                if(name === 'detail') document.getElementById('panel-detail').classList.add('active');
            }
        }

        // --- UTILITY & RENDERING ---
        function formatTime(date) { return new Date(date).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }); }

        function renderChatList() {
            const list = document.getElementById('chatList');
            if (appState.chats.length === 0) {
                list.innerHTML = `<div class="text-center text-gray-400 p-10"><i class="fab fa-whatsapp text-4xl mb-3"></i><p class="text-sm">Menunggu pesan masuk...</p></div>`;
                return;
            }
            list.innerHTML = '';
            appState.chats.forEach(chat => {
                const item = document.createElement('div');
                let activeClass = appState.activeChatId === chat.id ? 'bg-green-50 border-l-4 border-green-500' : 'border-l-4 border-transparent';
                item.className = `p-3 border-b cursor-pointer hover:bg-gray-50 flex items-center space-x-3 ${activeClass}`;
                item.onclick = () => selectChat(chat.id);
                
                let statusColor = 'bg-gray-400';
                if(chat.status.includes('AI')) statusColor = 'bg-green-500';
                if(chat.status.includes('ADMIN')) statusColor = 'bg-blue-500';
                if(chat.status.includes('INTERVENSI')) statusColor = 'bg-red-500 animate-pulse-custom';

                let lastMsg = chat.messages.length > 0 ? chat.messages[chat.messages.length-1].text : 'No messages';
                
                item.innerHTML = `
                    <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center text-gray-600 font-bold text-sm flex-shrink-0">${chat.name.charAt(0)}</div>
                    <div class="flex-1 overflow-hidden">
                        <div class="flex justify-between items-center">
                            <h4 class="font-semibold text-gray-800 text-sm truncate">${chat.name}</h4>
                            <span class="text-[10px] text-gray-400 flex-shrink-0">${chat.messages.length > 0 ? formatTime(chat.messages[chat.messages.length-1].time) : ''}</span>
                        </div>
                        <p class="text-xs text-gray-500 truncate">${lastMsg.substring(0, 30)}...</p>
                    </div>
                    <span class="status-dot ${statusColor} flex-shrink-0"></span>
                `;
                list.appendChild(item);
            });
            updateStats();
        }

        function updateStats() {
            document.getElementById('statTotal').innerText = appState.chats.length;
            document.getElementById('statAI').innerText = appState.stats.ai;
            document.getElementById('statAdmin').innerText = appState.stats.admin;
        }

        function renderMessages() {
            const chat = appState.chats.find(c => c.id === appState.activeChatId);
            const msgArea = document.getElementById('chatMessages');
            
            if (!chat) {
                msgArea.innerHTML = `<div class="text-center text-gray-500 mt-20"><i class="fab fa-whatsapp text-6xl mb-4 text-gray-300"></i><h2 class="text-lg font-light text-gray-400">Percakapan Eco Sport</h2></div>`;
                return;
            }
            
            document.getElementById('chatAvatar').innerText = chat.name.charAt(0);
            document.getElementById('chatName').innerText = chat.name;
            let statusColorHex = chat.status.includes('AI') ? '#25D366' : chat.status.includes('ADMIN') ? '#3b82f6' : '#ef4444';
            document.getElementById('chatStatus').innerHTML = `<span class="status-dot mr-1" style="background-color: ${statusColorHex}"></span> ${chat.status}`;

            msgArea.innerHTML = '';
            chat.messages.forEach(msg => {
                const div = document.createElement('div');
                let bubbleClass = '', label = '';
                
                if (msg.sender === 'customer') {
                    div.className = 'flex justify-start mb-2'; bubbleClass = 'chat-bubble-in';
                } else if (msg.sender === 'admin') {
                    div.className = 'flex justify-end mb-2'; bubbleClass = 'chat-bubble-out';
                } else if (msg.sender === 'ai') {
                    div.className = 'flex justify-end mb-2'; bubbleClass = 'chat-bubble-ai';
                    label = '<span class="text-[10px] text-green-600 font-bold block mb-1 flex items-center gap-1"><i class="fas fa-robot"></i> ECO SPORT AI</span>';
                }

                div.innerHTML = `
                    <div class="${bubbleClass} max-w-[75%] md:max-w-md p-2 shadow-sm relative">
                        ${label}
                        <p class="text-sm text-gray-800 whitespace-pre-wrap break-words">${msg.text}</p>
                        <span class="text-[9px] text-gray-400 block text-right mt-1">${formatTime(msg.time)}</span>
                    </div>
                `;
                msgArea.appendChild(div);
            });
            msgArea.scrollTop = msgArea.scrollHeight;
        }

        function renderCustomerDetail() {
            const chat = appState.chats.find(c => c.id === appState.activeChatId);
            const content = document.getElementById('customerDetailContent');
            
            if (!chat) {
                content.innerHTML = `<div class="text-center text-gray-400 mt-10"><i class="fas fa-user-circle text-5xl mb-3"></i><p class="text-sm">Detail pelanggan akan muncul di sini</p></div>`;
                return;
            }

            let collectedDataHtml = Object.entries(chat.orderData).map(([k, v]) => 
                `<div class="flex justify-between text-xs border-b py-2"><span class="text-gray-500 capitalize">${k}</span><span class="font-medium text-gray-800 text-right">${v || '-'}</span></div>`
            ).join('');

            content.innerHTML = `
                <div class="text-center mb-4">
                    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center text-green-600 font-bold text-3xl mx-auto mb-2">
                        ${chat.name.charAt(0)}
                    </div>
                    <h3 class="font-bold text-gray-800">${chat.name}</h3>
                    <p class="text-xs text-gray-500">${chat.phone}</p>
                </div>
                
                <div class="mb-4 p-2 bg-gray-50 rounded-lg border border-gray-100 text-center">
                    <p class="text-[10px] text-gray-500 mb-1">Status Chat</p>
                    <span class="font-bold text-xs text-gray-800">${chat.status}</span>
                </div>

                <h4 class="font-semibold text-gray-700 mb-2 text-sm border-b pb-2">Detail Pesanan Terkumpul</h4>
                <div class="space-y-1 mb-4">
                    ${collectedDataHtml || '<p class="text-xs text-gray-400 italic">AI sedang mengumpulkan data...</p>'}
                </div>

                <div class="mt-4">
                    <label class="text-xs font-semibold text-gray-600">Catatan Admin</label>
                    <textarea class="w-full mt-1 p-2 border rounded text-xs h-20 focus:outline-none focus:ring-1 focus:ring-green-500" placeholder="Tulis catatan internal..."></textarea>
                </div>

                ${chat.needsAdmin ? `
                    <div class="bg-red-50 border border-red-200 text-red-700 p-3 rounded-lg text-xs animate-pulse-custom mt-4">
                        <strong class="flex items-center gap-1 text-[10px]"><i class="fas fa-exclamation-triangle"></i> PERLU INTERVENSI ADMIN</strong>
                        <p class="mt-1">AI berhenti membalas. Mohon ditindaklanjuti segera.</p>
                    </div>
                ` : ''}
            `;
        }

        // --- LOGIKA CHAT & AI ---
        function selectChat(chatId) {
            appState.activeChatId = chatId;
            showPanel('chat');
            renderChatList();
            renderMessages();
            renderCustomerDetail();
        }

        function simulateIncomingMessage(text, phone = '628123456789', name = 'Pelanggan WA') {
            let chat = appState.chats.find(c => c.phone === phone);
            if (!chat) {
                chat = {
                    id: Date.now().toString(),
                    name: name,
                    phone: phone,
                    status: '🟡 MENUNGGU ADMIN',
                    messages: [],
                    orderData: { Nama: name, Jumlah: '-', Jenis: '-' },
                    needsAdmin: false,
                    aiTimer: null
                };
                appState.chats.unshift(chat);
            }

            chat.messages.push({ sender: 'customer', text: text, time: new Date() });
            
            const lowerText = text.toLowerCase();
            if (['komplain', 'refund', 'negosiasi', 'mahal', 'gagal', 'bukti transfer'].some(k => lowerText.includes(k))) {
                chat.needsAdmin = true;
                chat.status = '🔴 PERLU INTERVENSI ADMIN';
                renderChatList();
                return;
            }

            if (chat.status !== '🔵 ADMIN ACTIVE' && appState.autoReply && appState.aiActive) {
                chat.status = '🟡 MENUNGGU ADMIN';
                clearTimeout(chat.aiTimer);
                chat.aiTimer = setTimeout(() => {
                    triggerAIResponse(chat.id, text);
                }, appState.timer * 1000);
            }

            renderChatList();
            if (appState.activeChatId === chat.id) renderMessages();
        }

        async function triggerAIResponse(chatId, userText) {
            const chat = appState.chats.find(c => c.id === chatId);
            if (!chat || chat.status === '🔵 ADMIN ACTIVE' || chat.needsAdmin) return;

            chat.status = '🟢 AI ACTIVE';
            renderChatList();
            if (appState.activeChatId === chatId) { renderMessages(); renderCustomerDetail(); }
            
            // CEK KONEKSI AI
            if(!puterReady) {
                removeTypingIndicator(chatId);
                chat.messages.push({ sender: 'ai', text: "Maaf Kak, sistem AI sedang offline. Mohon tunggu admin membalas ya.", time: new Date() });
                renderMessages();
                return;
            }

            showTypingIndicator(chatId);

            try {
                const prompt = `
                    ${appState.systemPrompt}
                    Database Eco Sport: ${appState.database}
                    Data Pesanan saat ini: ${JSON.stringify(chat.orderData)}
                    
                    Balas pesan pelanggan ini: "${userText}"
                `;

                // Panggilan Puter AI Stabil
                const resp = await puter.ai.chat("gpt-4o-mini", [
                    { role: "system", content: prompt },
                    { role: "user", content: userText }
                ]);

                removeTypingIndicator(chatId);

                let aiText = "";
                if (typeof resp === 'string') aiText = resp;
                else if (resp?.message?.content) aiText = Array.isArray(resp.message.content) ? resp.message.content.map(c => c.text || "").join("") : resp.message.content;
                else if (resp?.content) aiText = resp.content;
                else if (resp?.text) aiText = resp.text;
                else aiText = "Maaf Kak, pelayanan AI sedang lambat. Mohon tunggu admin.";

                // Ekstraksi data manual akurat
                if(userText.match(/\d+\s*pcs/)) chat.orderData.Jumlah = userText.match(/\d+/)[0] + " pcs";
                if(userText.toLowerCase().includes('futsal')) chat.orderData.Jenis = 'Futsal';
                if(userText.toLowerCase().includes('bola')) chat.orderData.Jenis = 'Sepak Bola';

                chat.messages.push({ sender: 'ai', text: aiText, time: new Date() });
                appState.stats.ai++;
                
                renderChatList();
                if (appState.activeChatId === chatId) { renderMessages(); renderCustomerDetail(); }

            } catch (error) {
                console.error("AI Error Detail: ", error);
                removeTypingIndicator(chatId);
                let errMsg = "Maaf Kak, sistem AI sedang gangguan. Admin akan segera menghubungi Kakak.";
                chat.messages.push({ sender: 'ai', text: errMsg, time: new Date() });
                renderMessages();
            }
        }

        function showTypingIndicator(chatId) {
            const msgArea = document.getElementById('chatMessages');
            if(appState.activeChatId !== chatId) return;

            const div = document.createElement('div');
            div.id = `typing-${chatId}`;
            div.className = 'flex justify-end mb-2';
            div.innerHTML = `
                <div class="chat-bubble-ai p-3 shadow-sm">
                    <span class="text-[10px] text-green-600 font-bold block mb-1 flex items-center gap-1"><i class="fas fa-robot"></i> Eco Sport AI mengetik...</span>
                    <div class="flex gap-1 items-center">
                        <span class="w-2 h-2 bg-gray-400 rounded-full bounce-dot" style="animation-delay: 0.2s;"></span>
                        <span class="w-2 h-2 bg-gray-400 rounded-full bounce-dot" style="animation-delay: 0.4s;"></span>
                        <span class="w-2 h-2 bg-gray-400 rounded-full bounce-dot" style="animation-delay: 0.6s;"></span>
                    </div>
                </div>
            `;
            msgArea.appendChild(div);
            msgArea.scrollTop = msgArea.scrollHeight;
        }

        function removeTypingIndicator(chatId) { const el = document.getElementById(`typing-${chatId}`); if(el) el.remove(); }

        function adminTakeover() {
            const chat = appState.chats.find(c => c.id === appState.activeChatId);
            if (!chat) return;
            clearTimeout(chat.aiTimer);
            removeTypingIndicator(chat.id);
            chat.status = '🔵 ADMIN ACTIVE';
            chat.needsAdmin = false;
            renderChatList(); renderMessages(); renderCustomerDetail();
        }

        function returnToAI() {
            const chat = appState.chats.find(c => c.id === appState.activeChatId);
            if (!chat) return;
            chat.status = '🟢 AI ACTIVE';
            renderChatList(); renderMessages();
        }

        function adminSendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const chat = appState.chats.find(c => c.id === appState.activeChatId);
            if (!chat) return;

            if (chat.status !== '🔵 ADMIN ACTIVE') adminTakeover();

            chat.messages.push({ sender: 'admin', text: text, time: new Date() });
            appState.stats.admin++;
            input.value = '';
            renderChatList(); renderMessages();
        }

        function handleEnter(event) { if (event.key === 'Enter') adminSendMessage(); }

        // --- WEBHOOK TESTER ---
        function simulateTestMessage() {
            const msgs = [
                "Halo kak, bikin jersey bola 15 pcs bisa?",
                "Kak, mau tanya harga jersey futsal 10 pcs",
                "Bisa custom nama dan nomor tidak?"
            ];
            const msg = msgs[Math.floor(Math.random() * msgs.length)];
            simulateIncomingMessage(msg, "6285709693800", "Budi Santoso");
        }

        // --- SETTINGS MODAL ---
        function openSettings() {
            document.getElementById('setSystemPrompt').value = appState.systemPrompt;
            document.getElementById('setDatabase').value = appState.database;
            document.getElementById('setTimer').value = appState.timer;
            document.getElementById('settingsModal').style.display = 'flex';
        }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
        function saveSettings() {
            appState.systemPrompt = document.getElementById('setSystemPrompt').value;
            appState.database = document.getElementById('setDatabase').value;
            appState.timer = parseInt(document.getElementById('setTimer').value);
            appState.autoReply = document.getElementById('setAutoReply').checked;
            appState.aiActive = document.getElementById('setAiActive').checked;
            closeSettings();
        }

        // --- INISIALISASI APLIKASI ---
        renderChatList();
        updateStats();

        // Auto pesan masuk pertama untuk simulasi
        setTimeout(() => { simulateIncomingMessage("Halo kak, selamat siang. Saya mau tanya bikin jersey bola 15 pcs bisa?", "6285709693800", "Budi Santoso"); }, 4000);
    </script>
</body>
</html>
